function createTerritoryState(id){return {level:1,buildings:{},garrison:{Soldiers:10},construction:null,scorched:0,defenderStrategy:'Shield Wall'};}

function makePlayer(slot,name,faction,isHuman=true,custom={}){const safeFaction=factionDefs[faction]?faction:'Personalizado';const starts=Array.isArray(custom.territories)&&custom.territories.length?custom.territories.slice():[factionDefs[safeFaction].defaultCapital];const capital=starts.includes(custom.capital)?custom.capital:starts[0];const chosenGenerals=(Array.isArray(custom.generals)?custom.generals:[]).filter(id=>generalById(id)).slice(0,2);return {slot,name,faction:safeFaction,realmName:custom.realmName||factionDefs[safeFaction].name,isHuman,resources:clone(CFG.starting),territories:starts,armies:[createArmy(slot+'-main','Exército Principal',capital,chosenGenerals[0]||null)],generals:chosenGenerals,activeGeneral:chosenGenerals[0]||null,capital,ap:CFG.ap,recruitsUsed:{},defaultAttackStrategy:'Total Charge',defaultDefenseStrategy:'Shield Wall',relations:{},buildQueue:[],tradeRoutes:{},crisis:0,productionPenalty:0,factionUsedTurn:-1};}
function newGame(playerConfigs){const players=playerConfigs.map((c,i)=>makePlayer(i,c.name,c.faction,c.human,{territories:c.territories,capital:c.capital,generals:c.generals,realmName:c.realmName}));const owner={};Object.keys(territories).forEach(id=>owner[id]=null);players.forEach(p=>p.territories.forEach(t=>owner[t]=p.slot));const tstate=Object.fromEntries(Object.keys(territories).map(id=>[id,createTerritoryState(id)]));players.forEach(p=>{if(tstate[p.capital])tstate[p.capital].level=2;});return {version:VERSION,turn:1,current:0,players,owner,territoryState:tstate,weather:'Limpo',season:'Primavera',night:false,log:[{turn:1,msg:'Partida criada. Escolhas iniciais personalizadas aplicadas.'}],legendaryClaimed:{},war:{},eventsEnabled:true,gameOver:null,view:'overview',selectedTerritory:players[0].capital,selectedArmy:players[0].armies[0].id};}
let state=null;
let online=false, onlineRoom='', onlineToken='', onlineSlot=null, onlineWS=null, onlineReady=false;
function onlineSend(msg){if(onlineWS&&onlineWS.readyState===1)onlineWS.send(JSON.stringify(msg));}
function onlineConnect(){if(!online)return; const proto=location.protocol==='https:'?'wss':'ws'; onlineWS=new WebSocket(`${proto}://${location.host}`); onlineWS.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return} if(m.type==='hello')return; if(m.type==='error'){toast(m.message,'danger');return} if(m.type==='resumed'){onlineRoom=m.room.code;onlineSlot=m.slot;onlineReady=true;if(m.game){state=m.game;repairState();render();}else if(onlineSlot===0){const cfg=JSON.parse(sessionStorage.getItem('val_configs')||'[]');if(cfg.length){state=newGame(cfg);save();onlineSend({type:'initGame',game:state});render();}} return} if(m.type==='state'){if(m.game){state=m.game;repairState();render();} return}}; onlineWS.onopen=()=>onlineSend({type:'resume',code:onlineRoom,token:onlineToken}); onlineWS.onclose=()=>{onlineReady=false;setTimeout(()=>{if(online&&(!onlineWS||onlineWS.readyState!==1))onlineConnect()},1500)}; }
function onlineInit(){const qs=new URLSearchParams(location.search);online=qs.get('online')==='1';if(!online)return;onlineRoom=sessionStorage.getItem('val_room')||'';onlineToken=sessionStorage.getItem('val_token')||'';onlineConnect();}
function activePlayer(){return state.players[state.current]}
function getPlayer(slot){return state.players.find(p=>p.slot===slot)}
function getTerritory(id){return territories[id]}
function getOwnerPlayer(id){const s=state.owner[id];return s==null?null:getPlayer(s)}
function armyById(id){for(const p of state.players){const a=p.armies.find(x=>x.id===id);if(a)return a}return null}
function armyOwner(a){return state.players.find(p=>p.armies.includes(a))||null}
function log(msg){state.log.unshift({turn:state.turn,msg})}
function toast(msg,kind=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.className='toast',2600)}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));if(online&&onlineReady&&state&&Number(state.current)===Number(onlineSlot))onlineSend({type:'syncGame',game:state});}
function repairState(){
 if(!state||!state.players)return;
 state.players.forEach(p=>{
  p.armies=Array.isArray(p.armies)?p.armies:[];
  p.generals=Array.isArray(p.generals)?p.generals.filter(id=>generalById(id)):[ ];
  p.territories=Array.isArray(p.territories)?p.territories.filter(id=>territories[id]):[];
  p.ap=Math.max(0,Math.min(CFG.ap,Number(p.ap)||0));
  p.resources={...clone(CFG.starting),...(p.resources||{})};p.realmName=p.realmName||factionDefs[p.faction]?.name||p.faction;
  p.armies.forEach((a,i)=>{
   a.id=a.id||`${p.slot}-a${i+1}`;a.name=a.name||`Exército ${i+1}`;a.units=a.units||{};
   a.morale=Math.max(0,Math.min(100,Number(a.morale)||CFG.morale));
   a.alive=a.alive!==false;
   if(!territories[a.territory])a.territory=p.capital||p.territories[0]||territoryOrder[0];
  });
 });
 if(state.selectedArmy&&!armyById(state.selectedArmy))state.selectedArmy=activePlayer()?.armies.find(a=>a.alive)?.id||null;
 if(!state.selectedTerritory||!territories[state.selectedTerritory])state.selectedTerritory=activePlayer()?.capital||territoryOrder[0];
 state.version=VERSION;
}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.version===VERSION){state=s;return true}}catch(e){}return false}
function costText(c){return ['gold','food','wood','iron','arcana','prestige'].filter(k=>c[k]).map(k=>({gold:'🪙',food:'🍖',wood:'🪵',iron:'⛓️',arcana:'🔮',prestige:'⭐'}[k]+' '+num(c[k]))).join(' · ')||'Grátis'}
function canPay(p,c){return Object.keys(c).every(k=>(p.resources[k]??0)>=c[k])}
function pay(p,c){Object.keys(c).forEach(k=>p.resources[k]-=c[k])}
function addRes(p,c){Object.keys(c).forEach(k=>p.resources[k]=(p.resources[k]||0)+c[k])}
function controlled(id,p){return state.owner[id]===p.slot}
function levelLabel(n){return ['I','II','III','IV','V'][n-1]||n}
function buildingCost(bid,level=1){const b=buildings[bid],mult=[1,1.5,2,3,4.5][level-1]||1;const c={};Object.entries(b.base).forEach(([k,v])=>c[k]=Math.ceil(v*mult));return c}
function upgradeCost(from){const m={1:{gold:100,wood:50},2:{gold:200,wood:100},3:{gold:350,wood:150,iron:50},4:{gold:600,wood:250,iron:100}};return m[from]||null}
function buildingLevel(id,bid){return state.territoryState[id]?.buildings?.[bid]||0}
function addBuilding(id,bid,level=1){state.territoryState[id].buildings[bid]=Math.max(state.territoryState[id].buildings[bid]||0,level)}
function recruitmentCap(p,tid,cat){const ts=state.territoryState[tid], t=territories[tid];if(!controlled(tid,p))return 0;let cap=1;if(p.capital===tid)cap=4;else if(ts.buildings.fortress)cap=2;cap+=(ts.buildings.barracks||0)*[0,2,3,4,5,7][ts.buildings.barracks]||0; if(cat==='Cavalry')cap+=(ts.buildings.stable||0)*[0,2,3,4,5,7][ts.buildings.stable]||0;if(tid==='valeVerde')cap=Math.ceil(cap*1.2);return cap}
function recruitmentLevelMult(level){return [1,1.5,2,2.5,3][level-1]||1}
function armyPower(a){let total=0;for(const [uid,q] of Object.entries(a.units)){const u=unitById[uid];if(u)total+=q*u.power}return total}
function armyCount(a){return Object.values(a.units).reduce((s,q)=>s+q,0)}
function generalById(id){return generals.find(g=>g.id===id)||null}
function armyHasCategory(a,cat){return Object.keys(a.units).some(uid=>unitById[uid]?.cat===cat&&a.units[uid]>0)}
function defenseBonus(p,tid){const t=territories[tid],ts=state.territoryState[tid];let b=25;if(p.capital===tid)b+=25;if(ts.level>=2)b+=5*(ts.level-1);if(t.bonus.includes('defesa')){const m=t.bonus.match(/\+(\d+)% defesa/);if(m)b+=Number(m[1])}if(ts.buildings.fortress)b+=buildings.fortress.vals[ts.buildings.fortress-1];if(ts.buildings.wall)b+=buildings.wall.vals[ts.buildings.wall-1];if(ts.buildings.watchtower)b+=buildings.watchtower.vals[ts.buildings.watchtower-1]/2;return b}
function unitTerrainBonus(a,tid){const t=territories[tid],res={atk:0,def:0,food:0,mobility:0};for(const [uid,q] of Object.entries(a.units)){if(q<=0)continue;const u=unitById[uid];const best=u.best.split('/');if(best.some(x=>x.trim().toLowerCase()===t.terrain.toLowerCase()||t.name.toLowerCase().includes(x.trim().toLowerCase())))res.atk+=10;}if(t.terrain==='Floresta'){if(armyHasCategory(a,'Ranged'))res.atk+=10;if(armyHasCategory(a,'Cavalry'))res.atk-=15;}if(t.terrain==='Montanha'&&armyHasCategory(a,'Cavalry'))res.atk-=20;if(t.terrain==='Pântano'&&armyHasCategory(a,'Cavalry'))res.atk-=25;if(t.terrain==='Planície'&&armyHasCategory(a,'Cavalry'))res.atk+=15;if(t.terrain==='Deserto'&&armyHasCategory(a,'Ranged'))res.atk+=10;if(t.terrain==='Neve')res.mobility-=20;if(t.terrain==='Deserto')res.food+=25;return res}
function moraleBonus(m){if(m>=90)return 15;if(m>=80)return 10;if(m>=60)return 0;if(m>=40)return -10;if(m>=20)return -20;if(m>=1)return -25;return -100}
function generalCombatBonus(a){const g=generalById(a.generalId);if(!g)return 0;let base=g.bonus==='all'?10:15;const xp=Math.min(15,Math.floor((a.xp||0)/2)*5);return base+xp}
function hasBuilding(tid,bid,min=1){return buildingLevel(tid,bid)>=min}
function hasMightyRequirements(p,u,tid){if(u.cat!=='Legendary')return {ok:true,reason:''};const req=[];if(!p.territories.includes(tid))req.push('território-alvo controlado');if(state.territoryState[tid].level<3)req.push('território no nível III');if(!hasBuilding(tid,'beastSanctuary',3))req.push('Santuário de Bestas III');if(!hasBuilding(tid,'arcaneTower',2))req.push('Torre Arcana II');if(p.resources.gold<1500||p.resources.arcana<150||p.resources.prestige<10)req.push('1.500 ouro + 150 Arcana + 10 Prestígio');if(totalMilitaryPower(p)<300)req.push('exército com 300+ poder');if(p.territories.length<5)req.push('5+ territórios');if(state.legendaryClaimed[u.id])req.push('estoque global já reivindicado');return {ok:req.length===0,reason:req.join(', ')};}
function totalMilitaryPower(p){return p.armies.reduce((s,a)=>s+armyPower(a),0)}
function storageFood(p){let c=CFG.storageBase;for(const tid of p.territories){const lvl=buildingLevel(tid,'granary');if(lvl)c+=buildings.granary.vals[lvl-1]}return c}
function production(p){const out=R();for(const tid of p.territories){const t=territories[tid],ts=state.territoryState[tid];let base={gold:t.prod.gold,food:t.prod.food,wood:t.prod.wood,iron:t.prod.iron,arcana:t.prod.arcana};const territoryMult=1+(ts.level-1)*0.1;for(const k of ['gold','food','wood','iron','arcana'])out[k]+=Math.floor((base[k]||0)*territoryMult);if(t.prodBonus)for(const k in t.prodBonus)out[k]+=Math.floor((base[k]||0)*t.prodBonus[k]/100);for(const [bid,lvl] of Object.entries(ts.buildings)){const b=buildings[bid],val=b.vals[lvl-1];if(b.effect==='gold')out.gold+=val;if(b.effect==='food')out.food+=val;if(b.effect==='wood')out.wood+=val;if(b.effect==='iron')out.iron+=val;if(b.effect==='beastFood')out.food+=val;}if(tid==='deserto'&&ts.scorched>0)out.gold=Math.floor(out.gold*.75);if(p.productionPenalty>0){for(const k of ['gold','food','wood','iron','arcana'])out[k]=Math.floor(out[k]*(1-p.productionPenalty/100));}}if(p.faction==='Valthera')for(const k of ['gold','food','wood','iron','arcana'])out[k]+=Math.floor(out[k]*0.05);out.gold+=30;out.food+=50;return out}
function friendlyFoodArmy(p){return p.armies.filter(a=>a.alive).reduce((s,a)=>s+armyCount(a),0)}
function territoryConnectedToCapital(p,tid){if(tid===p.capital)return true;const seen=new Set([p.capital]),q=[p.capital];while(q.length){const x=q.shift();for(const n of territories[x].neighbors){if(!p.territories.includes(n))continue;if(n===tid)return true;if(!seen.has(n)){seen.add(n);q.push(n)}}}return false}
function hasExtendedSupply(p,tid){if(p.territories.includes(tid))return territoryConnectedToCapital(p,tid);const reachable=new Set([p.capital]),q=[p.capital];while(q.length){const x=q.shift();for(const n of territories[x].neighbors){if(p.territories.includes(n)&&!reachable.has(n)){reachable.add(n);q.push(n)}}}return [...reachable].some(r=>buildingLevel(r,'supplyDepot')>0&&territories[r].neighbors.includes(tid));}
function supplyStatus(p,a){if(a.territory===p.capital)return true;return territoryConnectedToCapital(p,a.territory)||hasExtendedSupply(p,a.territory)}
function foodMultiplier(p,a,tid){let mult=1;if(a.forcedMarch)mult*=1.25;if(state.owner[tid]!==p.slot)mult*=1.25;if(territories[tid].terrain==='Deserto')mult*=1.25;if(state.season==='Inverno')mult*=1.2;if(state.weather==='Calor intenso')mult*=1.15;if(a.besieged)mult*=1.5;if(a.rationing)mult*=.5;return mult}
function consumeFood(p){let total=0;for(const a of p.armies.filter(a=>a.alive)){const mult=foodMultiplier(p,a,a.territory);total+=Math.ceil(Object.entries(a.units).reduce((s,[uid,q])=>s+q*(unitById[uid]?.food||0),0)*mult)}const cap=storageFood(p);p.resources.food=Math.min(cap,p.resources.food);p.resources.food-=total;let status='normal';if(p.resources.food<0){status='zero';p.resources.food=0}else if(p.resources.food<cap*.25)status='low';else if(p.resources.food<cap*.5)status='medium';for(const a of p.armies.filter(a=>a.alive)){a.supplied=supplyStatus(p,a);if(!a.supplied)a.morale=Math.max(0,a.morale-5);if(status==='medium')a.morale=Math.max(0,a.morale-5);if(status==='low'){a.morale=Math.max(0,a.morale-10);if(armyPower(a)>0)a.morale=Math.max(0,a.morale-2)}if(status==='zero')a.morale=Math.max(0,a.morale-15)}return total}
function finishConstructions(p){for(const tid of p.territories){const ts=state.territoryState[tid];if(ts.construction){ts.construction.turnsLeft--;if(ts.construction.turnsLeft<=0){addBuilding(tid,ts.construction.bid,ts.construction.toLevel);log(`${p.name}: ${buildings[ts.construction.bid].name} ${levelLabel(ts.construction.toLevel)} concluída em ${territories[tid].name}.`);ts.construction=null}}}}
function randomEvent(){if(!state.eventsEnabled)return;const p=activePlayer();const evs=[['Caravana comercial','+60 gold',()=>p.resources.gold+=60],['Colheita abundante','+80 food',()=>p.resources.food=Math.min(storageFood(p),p.resources.food+80)],['Mercadores de ferro','+30 iron',()=>p.resources.iron+=30],['Surto arcano','+30 arcana',()=>p.resources.arcana+=30],['Bandidos na estrada','-40 gold',()=>p.resources.gold=Math.max(0,p.resources.gold-40)],['Incêndio florestal','-40 wood',()=>p.resources.wood=Math.max(0,p.resources.wood-40)],['Festival local','+3 morale',()=>p.armies.forEach(a=>a.morale=Math.min(100,a.morale+3))],['Pressão de fronteira','-2 morale',()=>p.armies.forEach(a=>a.morale=Math.max(0,a.morale-2))]];if(Math.random()<0.35){const e=evs[Math.floor(Math.random()*evs.length)];e[2]();log(`${p.name}: Evento "${e[0]}" (${e[1]}).`);}}
function seasonWeather(){state.season=SEASONS[Math.floor((state.turn-1)/4)%4];state.night=state.turn%2===0;state.weather=WEATHER[(state.turn*7+state.current*3)%WEATHER.length];}
function victoryCheck(){if(state.gameOver)return;for(const p of state.players){if(p.territories.length>=12){state.gameOver={winner:p.slot,reason:'Domination'};return}if(p.resources.gold>=2000&&p.resources.food>=2000){state.gameOver={winner:p.slot,reason:'Hegemony'};return}if(p.resources.prestige>=20&&p.territories.length>=8){state.gameOver={winner:p.slot,reason:'Prestige Victory'};return}const myth=['dragons','fadas','celestial','lunar'].filter(x=>p.territories.includes(x));if(myth.length>=4){state.gameOver={winner:p.slot,reason:'Mythic Ascension'};return}const aliveEnemy=state.players.filter(q=>q.slot!==p.slot).reduce((s,q)=>s+q.armies.filter(a=>armyPower(a)>0).length,0);if(aliveEnemy===0){state.gameOver={winner:p.slot,reason:'Military Supremacy'};return}for(const q of state.players.filter(q=>q.slot!==p.slot)){if(q.capital===null){continue}}}}
function endTurn(){const p=activePlayer();if(state.gameOver)return;finishConstructions(p);const prod=production(p);const routeGold=Object.keys(p.tradeRoutes||{}).filter(t=>p.territories.includes(t)).length*20;prod.gold+=routeGold;addRes(p,prod);const food=consumeFood(p);for(const tid of p.territories){const ts=state.territoryState[tid];if(ts.scorched>0)ts.scorched=Math.max(0,ts.scorched-1)}p.productionPenalty=Math.max(0,(p.productionPenalty||0)-25);if(p.crisis>0){if(state.owner[p.capital]===p.slot){p.crisis=0;p.productionPenalty=0;log(`${p.name}: a capital foi recuperada e a crise foi encerrada.`)}else{p.crisis--;if(p.crisis<=0){state.gameOver={winner:state.players.find(q=>q.slot!==p.slot)?.slot,reason:`Capital de ${p.name} não recuperada a tempo`};log(`${p.name}: a crise da capital terminou sem recuperação. Derrota por colapso da capital.`);}}}for(const a of p.armies){a.forcedMarch=false;a.rationing=false;a.beastBoost=0;a.siegeBoost=0;a.supplies=Math.max(0,(a.supplies||0)-Math.min(a.supplies||0,100));}if(p.territories.length===5||p.territories.length===8||p.territories.length===12)p.resources.prestige+=1;randomEvent();state.current=(state.current+1)%state.players.length;if(state.current===0)state.turn++;state.players[state.current].ap=CFG.ap;state.players[state.current].recruitsUsed={};seasonWeather();state.selectedTerritory=activePlayer().capital;state.selectedArmy=activePlayer().armies.find(a=>a.alive)?.id||null;log(`Turno ${state.turn}: ${activePlayer().name} recebeu a vez. Clima: ${state.weather}. ${state.night?'Noite':'Dia'}.`);victoryCheck();save();render();}
function actionCost(){return 1}
function spendAP(p,n=1){if(online && Number(state.current)!==Number(onlineSlot)){toast(`A vez é de ${state.players[state.current]?.name||'outro jogador'}.`,'danger');return false}if(p.ap<n){toast('AP insuficiente','danger');return false}p.ap-=n;return true}
function deployGeneral(a,gid){const p=activePlayer(),g=generalById(gid);if(!g||!p.generals.includes(gid)){toast('General inválido');return}if(a.generalId===gid)return;if(a.generalId&&a.generalId!==gid){p.resources.gold-=50;}
a.generalId=gid;log(`${p.name}: ${g.name} assumiu ${a.name}.`);save();render();}
function recruit(uid,tid,level){const p=activePlayer(),u=unitById[uid];if(!u)return;const cat=u.cat;if(!controlled(tid,p)){toast('Você não controla esse território');return}if(u.cat==='Legendary'){toast('Use o Trial lendário para uma unidade lendária.');return}const mult=recruitmentLevelMult(level);const qty=Math.ceil(u.qty*mult);const c={gold:Math.ceil(u.gold*mult),food:0,wood:Math.ceil((u.wood||0)*mult),iron:Math.ceil((u.iron||0)*mult),arcana:Math.ceil((u.arcana||0)*mult),prestige:0};const cap=recruitmentCap(p,tid,cat);const used=p.recruitsUsed[tid]||0;if(cap<=used){toast('Capacidade de recrutamento do território esgotada neste turno.');return}if(cat==='Magic'&&!hasBuilding(tid,'arcaneTower',1)){toast('Magia exige Torre Arcana I neste território.');return}if(cat==='Beast'&&!hasBuilding(tid,'beastSanctuary',1)&&!['War Horses'].includes(uid)){toast('Bestas exigem Santuário de Bestas I.');return}if(cat==='Mythic'&&!hasBuilding(tid,'beastSanctuary',1)){toast('Míticas exigem Santuário de Bestas I.');return}if(['Sorcerers','Archmages','Summoners'].includes(uid)&&!hasBuilding(tid,'arcaneTower',1)){toast('Exige Torre Arcana I.');return}if(uid==='Dragon'&&!p.territories.includes('dragons')){toast('Dragão exige Vale dos Dragões.');return}if(!canPay(p,c)){toast('Recursos insuficientes.');return}const a=p.armies.find(x=>x.territory===tid&&x.alive)||p.armies.find(x=>x.id===state.selectedArmy&&x.alive);if(!a){toast('Nenhum exército válido no território.');return}if(!spendAP(p,1))return;pay(p,c);a.units[uid]=(a.units[uid]||0)+qty;p.recruitsUsed[tid]=(used+1);log(`${p.name}: recrutou ${qty} ${u.name} em ${territories[tid].name} por ${costText(c)}. Poder +${num(qty*u.power)}.`);save();render();}
function recruitLegendary(uid,tid){const p=activePlayer(),u=unitById[uid];const req=hasMightyRequirements(p,u,tid);if(!req.ok){toast('Trial bloqueado: '+req.reason);return}if(!spendAP(p,3))return;pay(p,{gold:1500,arcana:150,prestige:10});const chance=.65+(p.faction==='Drakmor'?.2:0);if(Math.random()<=Math.min(.92,chance)){state.legendaryClaimed[uid]=p.slot;const a=p.armies.find(x=>x.territory===tid&&x.alive);a.units[uid]=1;log(`${p.name}: venceu o Trial de ${u.name} e conquistou a unidade lendária GLOBAL.`);toast(`${u.name} conquistado!`,'good');}else{p.resources.arcana+=50;log(`${p.name}: falhou no Trial de ${u.name}. O ritual devolveu 50 Arcana, mas os 3 AP foram gastos.`);toast('Trial falhou.','danger');}save();render();}
function build(tid,bid){const p=activePlayer(),b=buildings[bid],ts=state.territoryState[tid];if(!controlled(tid,p)){toast('Território não controlado');return}if(ts.construction){toast('Já existe uma construção em andamento');return}if(!spendAP(p,1))return;const c=buildingCost(bid,1);if(!canPay(p,c)){p.ap++;toast('Recursos insuficientes.');return}pay(p,c);ts.construction={bid,toLevel:1,turnsLeft:b.turns};log(`${p.name}: iniciou ${b.name} I em ${territories[tid].name}. Conclusão em ${b.turns} turno(s).`);save();render();}
function upgrade(tid,bid){const p=activePlayer(),ts=state.territoryState[tid],from=buildingLevel(tid,bid);if(from<1){toast('Construa a estrutura primeiro');return}if(from>=5){toast('Já está no nível V');return}if(ts.construction){toast('Já existe uma construção em andamento');return}const c=upgradeCost(from);if(!canPay(p,c)){toast('Recursos insuficientes para evolução');return}if(!spendAP(p,1))return;pay(p,c);ts.construction={bid,toLevel:from+1,turnsLeft:1};log(`${p.name}: evoluindo ${buildings[bid].name} de ${levelLabel(from)} para ${levelLabel(from+1)} em ${territories[tid].name}.`);save();render();}
function reachableTargets(from,forced=false){const set=new Set();const q=[[from,0]];const seen=new Set([from]);while(q.length){const [x,d]=q.shift();if(d>0)set.add(x);if(d>=(forced?2:1))continue;for(const n of territories[x].neighbors){if(!seen.has(n)){seen.add(n);q.push([n,d+1])}}}return [...set]}
function moveArmy(aid,toid,forced=false){const p=activePlayer(),a=p.armies.find(x=>x.id===aid);if(!a||!a.alive)return;if(!reachableTargets(a.territory,forced).includes(toid)){toast(forced?'Destino fora do alcance da marcha forçada.':'Territórios não são alcançáveis.');return}if(state.owner[toid]!==p.slot&&!state.war[p.slot+'-'+state.owner[toid]]&&state.owner[toid]!==null){toast('Você precisa estar em guerra com esse reino.');return}if(forced&&p.resources.food<=0){toast('Sem comida: marcha forçada bloqueada.');return}if(!spendAP(p,1))return;const from=a.territory;a.territory=toid;a.forcedMarch=forced||a.forcedMarch;if(forced)a.morale=Math.max(0,a.morale-10);log(`${p.name}: ${a.name} moveu de ${territories[from].name} para ${territories[toid].name}${forced?' em marcha forçada (até 2 territórios)':''}.`);save();render();}
function addWar(a,b){if(a===b)return;state.war[a+'-'+b]=true;state.war[b+'-'+a]=true;}
function areAllied(a,b){return state.war['ally-'+a+'-'+b]===true||state.war['ally-'+b+'-'+a]===true}
function relationAction(kind,targetSlot){const p=activePlayer(),q=getPlayer(targetSlot);if(!q||q.slot===p.slot)return;if(!spendAP(p,1))return;const key='ally-'+p.slot+'-'+q.slot;if(kind==='alliance'){state.war[key]=true;delete state.war[p.slot+'-'+q.slot];delete state.war[q.slot+'-'+p.slot];log(`${p.name} e ${q.name} firmaram uma ALIANÇA.`);}
if(kind==='truce'){delete state.war[p.slot+'-'+q.slot];delete state.war[q.slot+'-'+p.slot];state.war['truce-'+p.slot+'-'+q.slot]=true;state.war['truce-'+q.slot+'-'+p.slot]=true;log(`${p.name} e ${q.name} firmaram uma TRÉGUA.`);}
if(kind==='declare'){state.war['truce-'+p.slot+'-'+q.slot]=false;state.war['truce-'+q.slot+'-'+p.slot]=false;addWar(p.slot,q.slot);log(`${p.name} declarou guerra contra ${q.name}.`);}
if(kind==='trade'){if(p.resources.gold>=50&&q.resources.food>=50){p.resources.gold-=50;p.resources.food+=50;q.resources.gold+=50;q.resources.food-=50;log(`${p.name} trocou 50 ouro por 50 comida com ${q.name}.`)}else{toast('Troca exige que ambos tenham o recurso.');p.ap++;}}
if(kind==='tribute'){if(q.resources.gold>=50){q.resources.gold-=50;p.resources.gold+=50;log(`${q.name} pagou tributo de 50 ouro a ${p.name}.`)}else{toast('Alvo não tem 50 ouro.');p.ap++;}}
save();render();}
function ensureWar(attacker,defender){if(attacker===defender)return true;if(state.owner[defender]===null)return true;if(areAllied(attacker,defender))return false;return !!state.war[attacker+'-'+defender]}

 if(p.faction==='Drakmor'&&(armyHasCategory(att,'Beast')||armyHasCategory(att,'Mythic')))atkB+=10;if(p.faction==='Elandria'&&territories[tid].terrain==='Floresta'&&(armyHasCategory(att,'Ranged')||armyHasCategory(att,'Magic')))atkB+=10;if(p.faction==='Solaria'&&!state.night){if(armyHasCategory(att,'Magic'))atkB+=10;atkB+=5;}if(p.faction==='Vhalgard'&&(territories[tid].terrain==='Montanha'||tid==='fortaleza')&&(armyHasCategory(att,'Infantaria')||armyHasCategory(att,'Siege')))atkB+=10;if(p.faction==='Zayri'&&armyHasCategory(att,'Air'))atkB+=10;if(p.faction==='Lunaris'&&state.night&&(armyHasCategory(att,'Magic')||armyHasCategory(att,'Special')))atkB+=15;if(p.faction==='Valthera')atkB+=5;if(aBeastBoost(att))atkB+=att.beastBoost;if(att.siegeBoost)atkB+=att.siegeBoost;if(p.faction==='Aurelion'&&(['Battering Ram','Catapult','Trebuchet','Siege Tower','Heavy Siege Tower'].some(uid=>att.units[uid])))atkB+=10;if(p.faction==='Nharok'&&(att.units['Necromancers']||0)>0)atkB+=10;

function aHasMedic(a){return a.units['Field Medics']>0}function aBeastBoost(a){return (a.beastBoost||0)>0&&(armyHasCategory(a,'Beast')||armyHasCategory(a,'Mythic'))}function applyLoss(a,loss){for(const uid of Object.keys(a.units)){const q=a.units[uid]||0;a.units[uid]=Math.max(0,Math.floor(q*(1-loss/100)))}for(const uid of Object.keys(a.units)){if(a.units[uid]===0&&unitById[uid]?.cat==='Legendary'&&qCanRecover()){} }}function qCanRecover(){return false}function restorePct(a,per){for(const uid of Object.keys(a.units)){const q=a.units[uid];if(q>0)a.units[uid]=q+Math.max(0,Math.floor(q*per/100))}}

function slotHTML(i){const df=['Nharok','Aurelion','Drakmor'][i];const dt=[['mortos','floresta','pantano'],['fortaleza','montanhas','planicies'],['dragons','volcanicas','valeVerde']][i];const dg=[['mordek','vespera'],['aldric','thalia'],['kaelis','rhaegar']][i];return `<div class="card playerSetup"><h3>Jogador ${i+1}</h3><div class="form"><label>Nome do jogador</label><input class="input pname" data-i="${i}" value="${['Kauan','Arthur','Pietro'][i]||'Jogador '+(i+1)}"><label>Reino</label><select class="select pfaction" data-i="${i}">${factionOrder.map(f=>`<option value="${esc(f)}" ${f===df?'selected':''}>${factionDefs[f].emoji} ${esc(factionDefs[f].name)}</option>`).join('')}</select><input class="input customFactionName" data-i="${i}" placeholder="Nome do reino personalizado" style="display:none"><div class="muted" id="finfo${i}"></div><label>Territórios iniciais: escolha 3 a 5</label><div class="setupList">${territoryCheckHTML(i)}</div><label>Capital escolhida</label><select class="select pcapital" data-i="${i}"></select><label>Generais: escolha exatamente 2</label><div class="setupList">${generalCheckHTML(i)}</div><div class="setupHint" id="shint${i}"></div></div></div>`;}
function syncSlot(i){const faction=document.querySelector(`.pfaction[data-i="${i}"]`).value;const f=factionDefs[faction];const picked=[...document.querySelectorAll(`.pterritory[data-i="${i}"]:checked`)].map(x=>x.value);const cap=document.querySelector(`.pcapital[data-i="${i}"]`);const previous=cap.value;cap.innerHTML=picked.length?picked.map(t=>`<option value="${t}">${territories[t].emoji} ${esc(territories[t].name)}</option>`).join(''):'<option value="">Escolha territórios primeiro</option>';if(picked.includes(previous))cap.value=previous;else if(f.defaultCapital&&picked.includes(f.defaultCapital))cap.value=f.defaultCapital;const gens=[...document.querySelectorAll(`.pgeneral[data-i="${i}"]:checked`)].map(x=>x.value);document.querySelector(`.customFactionName[data-i="${i}"]`).style.display=faction==='Personalizado'?'block':'none';document.getElementById('finfo'+i).innerHTML=`<span class="pill">${f.emoji} ${esc(f.name)}</span> ${esc(f.special)}<br><small>${esc(f.ability)}</small>`;document.getElementById('shint'+i).innerHTML=`Territórios: <b>${picked.length}/5</b> · Generais: <b>${gens.length}/2</b>`;document.querySelectorAll(`.pterritory[data-i="${i}"]`).forEach(x=>x.closest('.choice')?.classList.toggle('selected',x.checked));document.querySelectorAll(`.pgeneral[data-i="${i}"]`).forEach(x=>x.closest('.choice')?.classList.toggle('selected',x.checked));}
function bindLobby(){for(let i=0;i<3;i++){const defaults=[['mortos','floresta','pantano'],['fortaleza','montanhas','planicies'],['dragons','volcanicas','valeVerde']][i];defaults.forEach(t=>{const el=document.querySelector(`.pterritory[data-i="${i}"][value="${t}"]`);if(el)el.checked=true});const gens=[['mordek','vespera'],['aldric','thalia'],['kaelis','rhaegar']][i];gens.forEach(g=>{const el=document.querySelector(`.pgeneral[data-i="${i}"][value="${g}"]`);if(el)el.checked=true});document.querySelectorAll(`.pfaction[data-i="${i}"]`).forEach(x=>x.addEventListener('change',()=>syncSlot(i)));document.querySelectorAll(`.pterritory[data-i="${i}"]`).forEach(x=>x.addEventListener('change',()=>{if(document.querySelectorAll(`.pterritory[data-i="${i}"]:checked`).length>5){x.checked=false;toast('Máximo de 5 territórios iniciais.');}syncSlot(i)}));document.querySelectorAll(`.pgeneral[data-i="${i}"]`).forEach(x=>x.addEventListener('change',()=>{if(document.querySelectorAll(`.pgeneral[data-i="${i}"]:checked`).length>2){x.checked=false;toast('Máximo de 2 generais.');}syncSlot(i)}));syncSlot(i);}document.getElementById('startBtn').onclick=()=>{const configs=[];const usedTerritories=new Set();for(let i=0;i<3;i++){const name=document.querySelector(`.pname[data-i="${i}"]`).value.trim()||`Jogador ${i+1}`;let faction=document.querySelector(`.pfaction[data-i="${i}"]`).value;let realmName=factionDefs[faction]?.name||faction;if(faction==='Personalizado'){realmName=document.querySelector(`.customFactionName[data-i="${i}"]`).value.trim()||`Reino de ${name}`;}const ts=[...document.querySelectorAll(`.pterritory[data-i="${i}"]:checked`)].map(x=>x.value);const gs=[...document.querySelectorAll(`.pgeneral[data-i="${i}"]:checked`)].map(x=>x.value);const capital=document.querySelector(`.pcapital[data-i="${i}"]`).value;if(ts.length<3||ts.length>5){toast(`Jogador ${i+1}: escolha entre 3 e 5 territórios.`);return}if(gs.length!==2){toast(`Jogador ${i+1}: escolha exatamente 2 generais.`);return}if(!capital||!ts.includes(capital)){toast(`Jogador ${i+1}: escolha uma capital válida.`);return}for(const t of ts){if(usedTerritories.has(t)){toast(`${territories[t].name} foi escolhido por mais de um jogador.`);return}usedTerritories.add(t)}configs.push({name,faction,realmName,territories:ts,capital,generals:gs,human:true});}state=newGame(configs);save();render();};document.getElementById('loadBtn').onclick=()=>{if(load()){repairState();render();}else toast('Nenhum save compatível encontrado.');};document.getElementById('clearSave').onclick=()=>{localStorage.removeItem(SAVE_KEY);toast('Save apagado.');};}
function lobbyHTML(){return `<div class="hero"><div class="heroBox"><div class="heroTitle">VALTHERION <span class="accent">CUSTOM REALMS</span></div><p class="subtitle">Agora você monta a abertura da guerra. Escolha livremente o reino, os 20 territórios, a capital e 2 dos 12 generais para cada jogador.</p><div class="banner"><b>Configuração:</b> 3 jogadores locais. Cada jogador escolhe 3 a 5 territórios diferentes, uma capital dentro deles e quaisquer 2 generais, mesmo que sejam de outro reino. O Exército Principal nasce automaticamente na capital com o primeiro general escolhido.</div><div class="playerSlots">${[0,1,2].map(i=>slotHTML(i)).join('')}</div><div class="startRow"><div class="muted">Modo local · 9 doutrinas disponíveis + reino personalizado · todos os 20 territórios.</div><button class="btn primary" id="startBtn">Criar partida personalizada</button></div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="loadBtn">Carregar partida salva</button><button class="btn danger" id="clearSave">Apagar save</button></div><div class="foot">Versão ${VERSION}. A configuração inicial não é mais presa a combinações fixas.</div></div></div>`}
function navButton(id,label,icon){return `<button data-view="${id}" class="${state.view===id?'active':''}">${icon} ${label}</button>`}
function gameHTML(){const p=activePlayer(),f=factionDefs[p.faction],prod=production(p),arms=p.armies.filter(a=>a.alive);return `<div class="app"><aside class="side"><div class="brand">VALTHERION<span>A GUERRA DOS REINOS</span></div><div class="playerBadge"><div class="name">${f.emoji} ${esc(p.name)}</div><div class="faction">${esc(p.realmName||f.name)} · ${esc(f.special)}</div><div class="turnMini">Turno ${state.turn} · ${state.night?'🌙 Noite':'☀️ Dia'} · ${state.weather}</div><div style="margin-top:9px"><span class="pill ${p.ap<=1?'warn':''}">⚡ ${p.ap} / ${CFG.ap} AP</span> <span class="pill">❤️ ${p.armies.reduce((s,a)=>s+a.morale,0)>0?Math.round(p.armies.reduce((s,a)=>s+a.morale,0)/Math.max(1,arms.length)):0} moral média</span></div></div><div class="nav">${navButton('overview','Visão geral','◈')}${navButton('territories','Territórios','▦')}${navButton('army','Exércitos','⚔')}${navButton('recruit','Recrutar','＋')}${navButton('buildings','Construções','▤')}${navButton('generals','Generais','♜')}${navButton('actions','Ações','◆')}${navButton('battle','Batalhas','⚔️')}${navButton('diplomacy','Diplomacia','◇')}${navButton('codex','Códice completo','📚')}${navButton('rules','Regras e correções','✓')}</div><div class="foot">Autosave ativo. Teclado: <span class="kbd">S</span> salva e <span class="kbd">N</span> encerra o turno.</div></aside><main class="main"><div class="top"><div><h1>${pageTitle(state.view)}</h1><p>${pageSubtitle(state.view)}</p></div><div class="actionsTop"><button class="btn" id="saveBtn">Salvar</button><button class="btn" id="newGameBtn" ${online?'disabled':''}>Nova partida</button>${state.gameOver?'<span class="pill good">🏆 Partida encerrada</span>':''}</div></div>${state.gameOver?`<div class="banner"><b>🏆 FIM DE JOGO:</b> ${esc(getPlayer(state.gameOver.winner).name)} venceu por <b>${esc(state.gameOver.reason)}</b>.</div>`:''}<div class="banner" style="margin-bottom:12px"><b>🌐 ${online?'VALTHERION ONLINE':'Modo local'}</b> · ${online?`Sala ${esc(onlineRoom)} · Jogador ${Number(onlineSlot)+1} · ${Number(state.current)===Number(onlineSlot)?'⚔️ SEU TURNO':'⏳ vez de '+esc(state.players[state.current]?.name||'outro jogador')}`:'partida no dispositivo'} </div><div id="viewRoot">${viewHTML()}</div></main></div>`}
function pageTitle(v){return {overview:'Salão do Reino',territories:'Atlas de Valtherion',army:'Exércitos',recruit:'Mercado de Recrutamento',buildings:'Arsenal de Construções',generals:'Generais',actions:'Painel de Ações',battle:'Batalhas e Cerco',diplomacy:'Diplomacia',codex:'Códice completo',rules:'Regras + correções'}[v]||'VALTHERION'}
function pageSubtitle(v){return {overview:'Tudo que importa para tomar decisões neste turno.',territories:'Os 20 territórios, produção, terreno, bônus, especializações e vizinhança.',army:'Composição, poder, moral, suprimentos, posição e comandantes.',recruit:'Todos os tipos de tropa, custo, consumo, poder e terreno ideal.',buildings:'Cada construção do nível I ao V, custos, duração e efeitos.',generals:'Os 12 generais nomeados, especialidade, habilidade e XP.',actions:'Todas as ações com AP, requisitos e consequências.',battle:'Reconhecimento, estratégias, terreno, clima, perdas e tomada de território.',diplomacy:'Alianças, tréguas, comércio, tributo e guerra.',codex:'Catálogo integral de unidades, estruturas, território e sistemas.',rules:'Valores oficiais usados pela versão e correções do motor.'}[v]||''}
function resCard(label,icon,val){return `<div class="card res"><span>${icon} ${label}</span><strong>${num(val)}</strong></div>`}
function viewHTML(){switch(state.view){case'overview':return overviewHTML();case'territories':return territoriesHTML();case'army':return armyHTML();case'recruit':return recruitHTML();case'buildings':return buildingsHTML();case'generals':return generalsHTML();case'actions':return actionsHTML();case'battle':return battleHTML();case'diplomacy':return diplomacyHTML();case'codex':return codexHTML();default:return rulesHTML();}}
function overviewHTML(){const p=activePlayer(),prod=production(p),f=factionDefs[p.faction];const myth=['dragons','fadas','celestial','lunar'].filter(x=>p.territories.includes(x));return `<div class="grid grid4">${resCard('Ouro','🪙',p.resources.gold)}${resCard('Comida','🍖',p.resources.food)}${resCard('Madeira','🪵',p.resources.wood)}${resCard('Ferro','⛓️',p.resources.iron)}${resCard('Arcana','🔮',p.resources.arcana)}${resCard('Prestígio','⭐',p.resources.prestige)}${resCard('Poder militar','⚔️',totalMilitaryPower(p))}${resCard('Territórios','▦',p.territories.length)}</div><div class="grid grid3" style="margin-top:12px"><div class="card"><h3>Estado do turno</h3><div class="miniGrid"><div class="miniCell"><span>AP</span><b>${p.ap}/5</b></div><div class="miniCell"><span>Estação</span><b>${state.season}</b></div><div class="miniCell"><span>Clima</span><b>${state.weather}</b></div><div class="miniCell"><span>Hora</span><b>${state.night?'Noite':'Dia'}</b></div><div class="miniCell"><span>Estoque</span><b>${num(p.resources.food)}/${num(storageFood(p))}</b></div></div><p class="muted">Produção prevista ao encerrar o turno: ${resText(prod)}. Comida só é consumida no fim do turno, evitando a antiga dupla cobrança no recrutamento.</p></div><div class="card"><h3>Reino ${f.emoji} ${esc(p.realmName||f.name)}</h3><p>${esc(f.special)}</p><div class="infoBox"><b>Habilidade:</b> ${esc(f.ability)}</div><p class="muted">Capital: ${p.capital?territories[p.capital].name:'em crise'} · Generais: ${p.generals.map(x=>generalById(x).name).join(', ')}</p></div><div class="card"><h3>Metas rápidas</h3><p>🏆 Dominação: ${p.territories.length}/12 territórios</p><p>🐉 Ascensão Mítica: ${myth.length}/4 territórios míticos</p><p>⭐ Prestígio: ${p.resources.prestige}/20 e ${p.territories.length}/8 territórios</p><p>🪙 Hegemonia: ${p.resources.gold}/2000 ouro e ${p.resources.food}/2000 comida</p></div></div><div class="twoCol" style="margin-top:12px"><div class="card"><div class="sectionTitle"><h2>Territórios controlados</h2><small>produção + bônus</small></div>${p.territories.map(tid=>territoryRow(tid,p)).join('')}</div><div class="card"><div class="sectionTitle"><h2>Exércitos</h2><small>${p.armies.filter(a=>a.alive).length} funcionais</small></div>${p.armies.map(a=>armyRow(a)).join('')}</div></div><div class="card" style="margin-top:12px"><div class="sectionTitle"><h2>Log recente</h2><small>mais novo primeiro</small></div><div class="log">${state.log.slice(0,18).map(x=>`<div class="logItem"><div class="meta">Turno ${x.turn}</div>${esc(x.msg)}</div>`).join('')}</div></div>`}
function territoryRow(tid,p){const t=territories[tid],ts=state.territoryState[tid],b=Object.entries(ts.buildings).filter(([,l])=>l>0).map(([bid,l])=>buildings[bid].name+' '+levelLabel(l)).join(', ')||'Sem estruturas ativas';return `<div class="choice" style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;gap:10px"><b>${t.emoji} ${esc(t.name)}</b><span class="pill">Nível ${ts.level}</span></div><div class="muted">${esc(t.terrain)} · ${esc(t.bonus)}</div><div class="tag">Produção: ${costText(t.prod)} · ${esc(t.special)}</div><div class="tag">Construções: ${esc(b)}${ts.construction?` · ⏳ ${esc(buildings[ts.construction.bid].name)} ${levelLabel(ts.construction.toLevel)} (${ts.construction.turnsLeft}T)`:''}</div></div>`}
function armyRow(a){const p=armyOwner(a),g=generalById(a.generalId);return `<div class="choice" style="margin-bottom:7px"><div style="display:flex;justify-content:space-between"><b>${esc(a.name)}</b><span class="pill ${a.morale<40?'bad':a.morale<60?'warn':'good'}">❤️ ${a.morale}</span></div><div class="muted">${territories[a.territory].name} · ⚔️ ${num(armyPower(a))} · ${armyCount(a)} tropas · ${a.supplied?'abastecido':'sem suprimentos'}</div><div class="tag">General: ${g?esc(g.name):'nenhum'} · XP ${a.xp||0}</div></div>`}
function territoriesHTML(){const p=activePlayer();return `<div class="banner"><b>Atlas:</b> roxo = seu território. Neutros não têm dono. Para cada território, a tabela mostra produção, terreno, bônus, especial, níveis e vizinhança.</div><div class="mapGrid">${territoryOrder.map(id=>{const t=territories[id],o=getOwnerPlayer(id),me=o?.slot===p.slot,ts=state.territoryState[id];return `<div class="territoryTile ${me?'ownerMe':''}"><div class="ttop"><div class="tn">${t.emoji} ${esc(t.name)}</div><span class="pill">${o?esc(o.name):'Neutro'}</span></div><div class="meta">${esc(t.terrain)} · L${ts.level}</div><div class="meta">${esc(t.bonus)}</div><div class="meta">Prod: ${costText(t.prod)}</div><button class="btn small" onclick="selectTerritory('${id}')">Detalhes</button></div>`}).join('')}</div><div class="twoCol" style="margin-top:12px"><div class="card">${territoryDetailHTML(state.selectedTerritory)}</div><div class="card stickyCard"><h3>Construções do território</h3>${buildOptionsForTerritory(state.selectedTerritory)}</div></div>`}
function territoryDetailHTML(tid){if(!tid)return'<div class="empty">Selecione um território.</div>';const t=territories[tid],ts=state.territoryState[tid],o=getOwnerPlayer(tid),p=activePlayer();return `<h3>${t.emoji} ${esc(t.name)}</h3><p><span class="pill">${esc(t.terrain)}</span> <span class="pill">Dono: ${o?esc(o.name):'Neutro'}</span> <span class="pill">Território ${ts.level===3?'III, MAESTRIA':levelLabel(ts.level)}</span></p><div class="infoBox"><b>Bônus:</b> ${esc(t.bonus)}<br><b>Especial:</b> ${esc(t.special)}<br><b>Produção base:</b> ${costText(t.prod)}<br><b>Vizinhos:</b> ${t.neighbors.map(n=>territories[n].name).join(', ')}</div><h4>Condições de terreno</h4><p class="muted">${TERRAIN_BONUS[t.terrain]?.text||'Condições padrão.'}</p><h4>Estruturas</h4>${Object.entries(ts.buildings).filter(([,l])=>l>0).map(([bid,l])=>`<div class="choice" style="margin:5px 0"><b>${buildings[bid].name} ${levelLabel(l)}</b><div class="tag">${buildingEffectText(bid,l)}</div></div>`).join('')||'<div class="empty">Nenhuma estrutura construída.</div>'}${o?.slot===p.slot?`<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" onclick="fortify('${tid}')">Fortificar / elevar nível</button></div>`:''}`}
function buildingEffectText(bid,l){const b=buildings[bid],v=b.vals[l-1];switch(b.effect){case'gold':return`+${v} ouro/turno`;case'food':return`+${v} comida/turno`;case'wood':return`+${v} madeira/turno`;case'iron':return`+${v} ferro/turno`;case'defense':return`+${v}% defesa`;case'wall':return`+${v}% resistência/defesa`;case'recruit':return`+${v} recrutamentos`;case'cavalry':return`+${v} recrutamentos de cavalaria`;case'vision':return`+${v}% visão/alerta`;case'magic':return l===1?'Habilita unidades mágicas básicas':`+${v}% magia`;case'beast':return l===1?'Habilita bestas/míticas básicas':`+${v}% bestas e míticas`;case'storageFood':return`+${v} capacidade de comida`;case'depot':return`+${v} suprimentos de linha`;case'mobility':return`+${v}% mobilidade`;case'engineering':return`+${v}% eficiência de engenharia`;case'port':return`+${v}% operações portuárias`;case'beastFood':return`+${v} comida/turno`;default:return''}}
function buildOptionsForTerritory(tid){const p=activePlayer(),own=controlled(tid,p),ts=state.territoryState[tid];return buildIds.map(bid=>{const lvl=buildingLevel(tid,bid),b=buildings[bid];const cost=lvl===0?buildingCost(bid,1):upgradeCost(lvl);const affordable=canPay(p,cost||{});const busy=!!ts.construction;const disabled=!own||busy||!affordable||lvl>=5;const action=lvl===0?'build':lvl<5?'upgrade':'';return `<div class="choice" style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(b.name)}</b><span class="pill">${lvl?levelLabel(lvl):'não construída'}</span></div><div class="tag">Custo: ${costText(cost)} · ${b.turns}T · ${buildingEffectText(bid,1)}</div>${lvl?`<div class="tag">Atual: ${buildingEffectText(bid,lvl)}${lvl<5?` · Próximo: ${buildingEffectText(bid,lvl+1)}`:''}</div>`:''}${busy?`<div class="tag">🚧 ${esc(buildings[ts.construction.bid].name)} em construção: ${ts.construction.turnsLeft} turno(s)</div>`:''}<button class="btn small primary buildAction" data-build-action="${action}" data-tid="${esc(tid)}" data-bid="${esc(bid)}" ${disabled?'disabled':''}>${lvl===0?'Comprar e construir':lvl<5?'Comprar evolução':'Nível máximo'}</button>${!own?'<div class="tag">Controle este território para construir.</div>':(!affordable&&!busy?'<div class="tag">Recursos insuficientes.</div>':'')}</div>`}).join('')}
function startBuild(tid,bid){build(tid,bid)}function upgradeBuild(tid,bid){upgrade(tid,bid)}
function bindBuildActions(){document.querySelectorAll('.buildAction').forEach(btn=>{btn.addEventListener('click',()=>{const tid=btn.dataset.tid,bid=btn.dataset.bid;if(btn.dataset.buildAction==='build')build(tid,bid);else if(btn.dataset.buildAction==='upgrade')upgrade(tid,bid);});});}
function armyHTML(){const p=activePlayer();const armies=p.armies.filter(a=>a.alive);if(!armies.length)return `<div class="empty card"><h3>Nenhum exército funcional</h3><p>Crie um novo exército na capital.</p><button class="btn primary" type="button" onclick="adminAction('newArmy','${p.capital}')">Criar exército (1 AP)</button></div>`;const selected=armies.find(a=>a.id===state.selectedArmy)||armies[0];state.selectedArmy=selected.id;const comp=Object.entries(selected.units).filter(([,q])=>q>0).map(([uid,q])=>{const u=unitById[uid];return `<tr><td><b>${esc(u?.name||uid)}</b><div class="tag">${esc(u?.cat||'')}</div></td><td>${num(q)}</td><td>${num(q*(u?.power||0))}</td><td>${num(q*(u?.food||0))}</td><td>${u?.arcana?num(q*u.arcana):'0'}</td><td>${esc(u?.best||'N/A')}</td></tr>`}).join('')||'<tr><td colspan="6">Este exército ainda não possui tropas. Use Recrutar e selecione este exército.</td></tr>';const genOpts=p.generals.map(id=>{const g=generalById(id);return g?`<option value="${id}" ${selected.generalId===id?'selected':''}>${esc(g.name)}</option>`:''}).join('');return `<div class="banner"><b>Exércitos corrigidos:</b> a lista não depende mais do formato do ID. O exército selecionado é validado automaticamente; a composição mostra quantidade, poder, comida, Arcana e local ideal de cada tropa.</div><div class="card"><div class="sectionTitle"><h2>Todos os seus exércitos</h2><small>${armies.length} funcional(is)</small></div><div style="display:flex;gap:6px;flex-wrap:wrap">${armies.map(a=>`<button class="btn small ${a.id===selected.id?'primary':''}" type="button" onclick="selectArmy('${a.id}')">⚔ ${esc(a.name)} · ${territories[a.territory].emoji} · ${num(armyPower(a))}</button>`).join('')}</div></div><div class="twoCol" style="margin-top:12px"><div class="card"><div class="sectionTitle"><h2>${esc(selected.name)}</h2><small>${esc(selected.id)}</small></div><div class="grid grid4"><div class="miniCell"><span>Posição</span><b>${territories[selected.territory].emoji} ${esc(territories[selected.territory].name)}</b></div><div class="miniCell"><span>Poder total</span><b>${num(armyPower(selected))}</b></div><div class="miniCell"><span>Tropas</span><b>${num(armyCount(selected))}</b></div><div class="miniCell"><span>Moral</span><b>${selected.morale}/100</b></div></div><div class="progress" style="margin:10px 0"><i style="width:${Math.max(0,Math.min(100,selected.morale))}%"></i></div><div class="infoBox">${selected.supplied?'✅ Abastecido':'⚠️ Sem suprimentos'} · ${selected.besieged?'🏰 Em cerco':'🛡️ Campo aberto'} · ${selected.forcedMarch?'⚡ Marcha forçada':'🚶 Normal'}</div><p><label class="tag">General comandante</label><select class="select" onchange="deployGeneral(armyById('${selected.id}'),this.value)"><option value="">Nenhum</option>${genOpts}</select></p><h4>Composição completa</h4><div class="tableWrap"><table class="table"><thead><tr><th>Unidade</th><th>Qtd.</th><th>Poder</th><th>Comida/turno</th><th>Arcana do pacote</th><th>Melhor território/local</th></tr></thead><tbody>${comp}</tbody></table></div></div><div class="card stickyCard"><h3>Administrar</h3><div class="grid grid2"><button class="btn" type="button" onclick="adminAction('newArmy','${selected.territory}')">Novo exército (1 AP)</button><button class="btn" type="button" onclick="adminAction('split')">Dividir (1 AP)</button><button class="btn" type="button" onclick="adminAction('merge')">Fundir (1 AP)</button><button class="btn" type="button" onclick="adminAction('renameArmy')">Renomear</button></div><h4 style="margin-top:12px">Transferir tropas</h4><select id="dstArmy" class="select">${armies.filter(a=>a.id!==selected.id&&a.territory===selected.territory).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')||'<option value="">Nenhum exército no território</option>'}</select><select id="transferUnit" class="select">${Object.keys(selected.units).filter(uid=>selected.units[uid]>0).map(uid=>`<option value="${uid}">${esc(unitById[uid]?.name||uid)}</option>`).join('')||'<option value="">Nenhuma unidade</option>'}</select><input id="transferQty" class="input" type="number" min="1" value="1"><button class="btn small" type="button" onclick="transferTroops()">Transferir (1 AP)</button><h4 style="margin-top:12px">Mover</h4><select id="moveTo" class="select">${reachableTargets(selected.territory,false).map(n=>`<option value="${n}">1 passo · ${territories[n].emoji} ${esc(territories[n].name)}</option>`).join('')}${reachableTargets(selected.territory,true).filter(n=>!reachableTargets(selected.territory,false).includes(n)).map(n=>`<option value="${n}">2 passos · ${territories[n].emoji} ${esc(territories[n].name)}</option>`).join('')}</select><div class="grid grid2" style="margin-top:6px"><button class="btn primary" type="button" onclick="moveArmy('${selected.id}',document.getElementById('moveTo').value,false)">Mover (1 AP)</button><button class="btn warn" type="button" onclick="moveArmy('${selected.id}',document.getElementById('moveTo').value,true)">Marcha forçada (1 AP)</button></div><h4 style="margin-top:12px">Resumo rápido</h4>${armies.map(a=>`<div class="choice" style="margin:5px 0"><b>${esc(a.name)}</b><div class="tag">${territories[a.territory].emoji} ${esc(territories[a.territory].name)} · ${num(armyPower(a))}⚔ · ${num(armyCount(a))} tropas · moral ${a.morale}</div></div>`).join('')}</div></div>`}
function recruitHTML(){const p=activePlayer(),tid=state.selectedTerritory||p.capital;return `<div class="card"><div class="sectionTitle"><h2>Catálogo de todas as tropas</h2><small>1 AP por recrutamento · nível de pacote I-V</small></div><div class="tabs">${['Todos',...unitCats].map(c=>`<button class="filterCat ${c==='Todos'?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="form" style="max-width:370px"><label>Território de recrutamento</label><select class="select" id="recruitTerritory">${p.territories.map(x=>`<option value="${x}" ${x===tid?'selected':''}>${territories[x].name}</option>`).join('')}</select><label>Nível do pacote</label><select class="select" id="recruitLevel"><option value="1">I · ×1</option><option value="2">II · ×1,5</option><option value="3">III · ×2</option><option value="4">IV · ×2,5</option><option value="5">V · ×3</option></select></div></div><div class="tableWrap" style="margin-top:12px"><table class="table" id="recruitTable"><thead><tr><th>Categoria</th><th>Unidade</th><th>Pacote base</th><th>Custo base</th><th>Madeira/Ferro</th><th>Comida/ind.</th><th>Arcana</th><th>Poder/ind.</th><th>Onde é melhor</th><th>Especial</th><th>Ação</th></tr></thead><tbody>${unitDefs.map(u=>recruitRow(u)).join('')}</tbody></table></div>`}
function recruitRow(u){const p=activePlayer(),legend=u.cat==='Legendary';return `<tr data-cat="${esc(u.cat)}"><td>${esc(u.cat)}</td><td><b>${esc(u.name)}</b></td><td>${num(u.qty)}</td><td>${costText({gold:u.gold,food:0,arcana:u.arcana,prestige:u.prestige})}</td><td>${u.wood?num(u.wood):'-'} / ${u.iron?num(u.iron):'-'}</td><td>${num(u.food)}</td><td>${num(u.arcana)}</td><td>${u.power}</td><td>${esc(u.best)}</td><td>${esc(u.special)}</td><td>${legend?`<button class="btn small danger" onclick="recruitLegendary('${u.id}',document.getElementById('recruitTerritory').value)">Trial (3 AP)</button>`:`<button class="btn small primary" onclick="recruit('${u.id}',document.getElementById('recruitTerritory').value,+document.getElementById('recruitLevel').value)">Recrutar</button>`}</td></tr>`}
function buildingsHTML(){return `<div class="banner"><b>Construção em duas etapas:</b> gastar 1 AP inicia a obra; ela só vira ativa quando o contador chegar a zero. Evolução I→V usa os custos oficiais do motor e não cobra produção antecipadamente.</div><div class="tableWrap"><table class="table"><thead><tr><th>Estrutura</th><th>Categoria</th><th>Custo I</th><th>Duração</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th></tr></thead><tbody>${buildIds.map(bid=>{const b=buildings[bid];return`<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.cat)}</td><td>${costText(buildingCost(bid,1))}</td><td>${b.turns}T</td>${b.vals.map((v,i)=>`<td>${esc(buildingEffectText(bid,i+1))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="card" style="margin-top:12px"><h3>Custos de evolução</h3><div class="tableWrap"><table class="table"><thead><tr><th>Evolução</th><th>Custo</th><th>Multiplicador de efeito</th></tr></thead><tbody>${globalRules.building.map((r,i)=>i<4?`<tr><td>${r[0]} → ${globalRules.building[i+1][0]}</td><td>${costText(upgradeCost(i+1))}</td><td>${r[1]} → ${globalRules.building[i+1][1]}</td></tr>`:'').join('')}</tbody></table></div></div>`}
function generalsHTML(){const p=activePlayer();return `<div class="banner"><b>Regra de generais:</b> cada reino começa com 2. A especialidade dá +15%. A cada 2 XP, o general recebe +5% de bônus de especialidade, até +15% extras. General atribuído aparece na ficha do exército.</div><div class="grid grid3">${generals.map(g=>{const mine=p.generals.includes(g.id);return`<div class="card ${mine?'choice selected':''}"><h3>${g.faction==='Nharok'?'💀':g.faction==='Aurelion'?'🏰':'🐉'} ${esc(g.name)}</h3><p><span class="pill">${esc(g.spec)}</span> ${mine?'<span class="pill good">Seu</span>':''}</p><div class="tag">Especialidade: ${esc(g.bonus)} · ${esc(g.ability)}</div><p class="muted">${esc(g.desc)}</p>${mine?`<button class="btn small" onclick="assignGen('${g.id}')">Atribuir ao exército selecionado</button>`:''}</div>`}).join('')}</div>`}
function assignGen(gid){const p=activePlayer(),a=p.armies.find(a=>a.id===state.selectedArmy);if(!a){toast('Selecione um exército no painel Exércitos');return}deployGeneral(a,gid)}
function actionsHTML(){const p=activePlayer();return `<div class="grid grid3"><div class="card"><h3>⚡ AP</h3><p>Você tem <b>${p.ap}</b> de 5.</p><p class="muted">Normalmente, cada ação custa 1 AP. Trial lendário custa 3 AP.</p><button class="btn primary" onclick="endTurn()">Encerrar turno</button></div><div class="card"><h3>Estratégias padrão</h3><label class="tag">Ataque</label><select class="select" onchange="setStrategy('defaultAttackStrategy',this.value)">${Object.keys(strategies).filter(x=>strategies[x].kind==='Ofensiva').map(x=>`<option ${p.defaultAttackStrategy===x?'selected':''} value="${x}">${strategies[x].name}</option>`).join('')}</select><label class="tag">Defesa</label><select class="select" onchange="setStrategy('defaultDefenseStrategy',this.value)">${Object.keys(strategies).filter(x=>strategies[x].kind==='Defensiva').map(x=>`<option ${p.defaultDefenseStrategy===x?'selected':''} value="${x}">${strategies[x].name}</option>`).join('')}</select></div><div class="card"><h3>Administração</h3><button class="btn small" onclick="claimTitle()">Gastar 5 ⭐ em título</button><button class="btn small" onclick="factionAbility()">Habilidade de facção</button><p class="muted">Dividir/fundir exércitos e trocar general ficam no painel Exércitos.</p></div></div><div class="grid grid2" style="margin-top:12px"><div class="card"><h3>Logística e administração executáveis</h3><div class="form"><label>Comida para exército selecionado</label><input id="supplyAmount" class="input" type="number" min="1" value="100"><button class="btn small" onclick="sendSupplies()">Enviar suprimentos (1 AP)</button><label>Destino de transferência de recursos</label><select id="trPlayer" class="select">${state.players.filter(q=>q.slot!==p.slot).map(q=>`<option value="${q.slot}">${esc(q.name)}</option>`).join('')}</select><select id="trResource" class="select"><option value="gold">Ouro</option><option value="food">Comida</option><option value="wood">Madeira</option><option value="iron">Ferro</option><option value="arcana">Arcana</option></select><input id="trAmount" class="input" type="number" min="1" value="50"><button class="btn small" onclick="transferResources()">Transferir recursos (1 AP)</button></div></div><div class="card"><h3>Movimentação, rotas e magia</h3><div class="form"><label>Destino do Portal Arcano</label><select id="portalTarget" class="select">${p.territories.map(t=>`<option value="${t}">${territories[t].name}</option>`).join('')}</select><button class="btn small" onclick="arcanePortal()">Portal Arcano (1 AP + 10 Arcana)</button><label>Território para rota comercial</label><select id="routeTerritory" class="select">${p.territories.map(t=>`<option value="${t}">${territories[t].name}</option>`).join('')}</select><button class="btn small" onclick="createTradeRoute(document.getElementById('routeTerritory').value)">Criar rota comercial (1 AP)</button><label>Território inimigo para Terra Arrasada</label><select id="scorchedTarget" class="select">${territoryOrder.filter(t=>getOwnerPlayer(t)&&getOwnerPlayer(t).slot!==p.slot).map(t=>`<option value="${t}">${territories[t].name}</option>`).join('')||'<option>Nenhum inimigo</option>'}</select><button class="btn small danger" onclick="scorchedEarth(document.getElementById('scorchedTarget').value)">Terra Arrasada (1 AP)</button></div></div></div><div class="twoCol" style="margin-top:12px"><div class="card"><h3>📚 Catálogo de ações</h3><div class="tableWrap"><table class="table"><thead><tr><th>Ação</th><th>AP</th><th>Descrição</th></tr></thead><tbody>${[['Recrutar unidade',1,'Adiciona um pacote de tropa a um exército no território.'],['Construir estrutura',1,'Inicia construção. O efeito só começa após concluir.'],['Evoluir construção',1,'I→V, seguindo os custos oficiais.'],['Mover exército',1,'Move 1 território adjacente.'],['Marcha forçada',1,'Move com logística especial, +25% comida e -10 moral.'],['Atacar território',1,'Inicia batalha.'],['Iniciar cerco',1,'Drena resistência de muralha com máquinas e engenheiros.'],['Fortificar / elevar território',1,'Aumenta L1→L3 e melhora produção/maestria.'],['Espionar',1,'Revela exército, posição e estrutura do alvo.'],['Sabotar',1,'Danifica construção ou produção.'],['Enviar suprimentos',1,'Ação logística documentada no codex.'],['Criar depósito',1,'Ativa infraestrutura de suprimentos via construção.'],['Transferir tropas',1,'Mover unidades entre exércitos no mesmo território.'],['Transferir recursos',1,'Ação econômica/diplomática para mover recursos.'],['Criar guarnição',1,'Define força permanente territorial.'],['Usar magia',1,'Feitiço comum/poderoso/lendário conforme Arcana.'],['Habilidade de facção',1,'Usa a habilidade especial do reino.'],['Diplomacia',1,'Aliança, trégua, comércio, tributo ou guerra.'],['Explorar território',1,'Reconhecimento de território e condições.'],['Desenvolver território',1,'Subir L1→L3.'],['Criar rota comercial',1,'Expande economia e pode coexistir com mercado/porto.'],['Encerrar turno',0,'Produção, comida, construções, eventos e passa a vez.']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>✨ Magia</h3>${Object.keys(strategies).filter(x=>strategies[x].kind==='Mítico').map(x=>`<div class="choice" style="margin-bottom:7px"><b>${strategies[x].name}</b><div class="tag">Custo: 🔮 ${strategies[x].arcana} · ${strategies[x].desc}</div><button class="btn small" onclick="useMagic('${x}')">Lançar</button></div>`).join('')}</div></div>`}
function battleHTML(){const p=activePlayer(),a=p.armies.find(a=>a.id===state.selectedArmy)||p.armies[0];const options=Object.keys(strategies).filter(k=>strategies[k].kind==='Ofensiva');return `<div class="banner"><b>Motor de batalha:</b> Recon → Ranged → Magic → combate principal → moral. O resultado usa poder base, terreno, counters, general, moral, fortificações, estratégia, clima e dia/noite. O relatório completo entra no log.</div><div class="twoCol"><div class="card"><h3>Ataque</h3>${a?`<p>Exército: <b>${esc(a.name)}</b> · ${num(armyPower(a))} poder · ${territories[a.territory].name}</p>`:'<p>Nenhum exército.'}<label class="tag">Estratégia ofensiva</label><select id="attackStrategy" class="select">${options.map(x=>`<option value="${x}" ${p.defaultAttackStrategy===x?'selected':''}>${strategies[x].name}</option>`).join('')}</select><label class="tag">Alvo</label><select id="battleTarget" class="select">${territoryOrder.filter(t=>t!==a?.territory).map(t=>{const o=getOwnerPlayer(t);return `<option value="${t}">${territories[t].name} · ${o?o.name:'Neutro'}</option>`}).join('')}</select><button class="btn danger" style="margin-top:8px;width:100%" onclick="battle('${a?.id}',document.getElementById('battleTarget').value,document.getElementById('attackStrategy').value)">Atacar (1 AP)</button></div><div class="card"><h3>Regras de resultado</h3>${globalRules.losses.map(r=>`<div class="choice" style="margin-bottom:6px"><b>${r[0]}</b><div class="tag">${r[1]}</div></div>`).join('')}<p class="muted">Contra-unidades: lanceiros +30% vs cavalaria; arqueiros +20% vs lentos; besteiros +25% vs pesados; cavalaria +25% vs ranged; machadeiros +20% vs infantaria; magia +20% vs grupos grandes; antiaéreo +30% vs aéreo; pikes +30% vs criaturas grandes.</p></div></div>`}
function diplomacyHTML(){const p=activePlayer();return `<div class="grid grid3">${state.players.filter(q=>q.slot!==p.slot).map(q=>`<div class="card"><h3>${factionDefs[q.faction].emoji} ${esc(q.name)}</h3><p class="muted">${esc(q.faction)} · ${q.territories.length} territórios · ${num(totalMilitaryPower(q))} poder</p><div class="infoBox">Relação: ${areAllied(p.slot,q.slot)?'ALIADOS':state.war[p.slot+'-'+q.slot]?'GUERRA': 'NEUTRAL'}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px"><button class="btn small good" onclick="relationAction('alliance',${q.slot})">Aliança</button><button class="btn small" onclick="relationAction('truce',${q.slot})">Trégua</button><button class="btn small" onclick="relationAction('trade',${q.slot})">Comércio 50↔50</button><button class="btn small warn" onclick="relationAction('tribute',${q.slot})">Tributo</button><button class="btn small danger" onclick="relationAction('declare',${q.slot})">Declarar guerra</button><button class="btn small" onclick="spy(${q.slot})">Espionar</button></div></div>`).join('')}</div>`}
function codexHTML(){return `<div class="grid grid2"><div class="card"><h3>20 territórios</h3><p class="muted">Abra Atlas para os detalhes completos. O banco oficial contém terreno, vizinhos, produção, bônus e especialização de cada território.</p><div class="tableWrap"><table class="table"><thead><tr><th>Território</th><th>Terreno</th><th>Produção</th><th>Bônus</th><th>Especial</th></tr></thead><tbody>${territoryOrder.map(id=>{const t=territories[id];return`<tr><td>${t.emoji} ${esc(t.name)}</td><td>${esc(t.terrain)}</td><td>${costText(t.prod)}</td><td>${esc(t.bonus)}</td><td>${esc(t.special)}</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><h3>Condições de terreno e tempo</h3><p>Floresta: ranged +10; cavalry -15; emboscadas +15.</p><p>Montanha: defensor +30; cavalry atacante -20.</p><p>Pântano: defensor +25; cavalry -25.</p><p>Planície: cavalry +15.</p><p>Deserto: ranged +10; consumo +25.</p><p>Neve: movimento -20.</p><hr><p>Chuva: ranged -10; fogo -20.</p><p>Névoa: ranged -20.</p><p>Nevasca: cavalry -15; movimento -30.</p><p>Tempestade: aéreo -20; magia elétrica +15.</p><p>Calor intenso: consumo +15.</p><p>Noite: stealth +15; archers -10; lunar +20.</p></div></div><div class="card" style="margin-top:12px"><h3>Unidades e terreno ideal</h3><div class="tableWrap"><table class="table"><thead><tr><th>Categoria</th><th>Unidade</th><th>Pacote</th><th>Custo</th><th>Food</th><th>Arcana</th><th>Poder</th><th>Melhor local</th><th>Especial</th></tr></thead><tbody>${unitDefs.map(u=>`<tr><td>${esc(u.cat)}</td><td>${esc(u.name)}</td><td>${u.qty}</td><td>${costText({gold:u.gold,wood:u.wood,iron:u.iron})}</td><td>${u.food}</td><td>${u.arcana}</td><td>${u.power}</td><td>${esc(u.best)}</td><td>${esc(u.special)}</td></tr>`).join('')}</tbody></table></div></div>`}
function rulesHTML(){return `<div class="grid grid3"><div class="card"><h3>Recursos iniciais</h3><p>500 ouro · 600 comida · 300 madeira · 200 ferro · 100 Arcana · 0 Prestígio.</p><h4>Capacidade de comida</h4><p>Base 1.000. Cada Celeiro soma 500/750/1.000/1.500/2.250 conforme I-V.</p></div><div class="card"><h3>Recrutamento</h3>${globalRules.recruit.map(r=>`<p><b>Nível ${r[0]}</b>: ${r[1]}</p>`).join('')}<p class="muted">Custos e tamanhos sobem com o mesmo multiplicador. A comida é debitada no fim do turno.</p></div><div class="card"><h3>Moral</h3>${globalRules.morale.map(r=>`<p><b>${r[0]}</b>: ${r[1]}</p>`).join('')}</div></div><div class="grid grid2" style="margin-top:12px"><div class="card"><h3>Correções de bug aplicadas nesta edição</h3><ul class="list"><li>Produção e construções agora têm ciclo claro: obra conclui antes de produzir no próximo encerramento.</li><li>Comida não é mais cobrada na compra da tropa e novamente no fim do turno. O consumo é único por turno.</li><li>Custos de unidades aéreas incluem madeira e ferro na tabela e no débito.</li><li>Escala I-V do recrutamento realmente altera quantidade e custos.</li><li>Construções I-V guardam nível real e seu efeito entra no cálculo de produção/defesa.</li><li>Legendárias exigem Trial e critérios completos; estoque é global e único.</li><li>AP volta para 5 somente no início da vez do jogador, sem acumular além do teto.</li><li>Territórios, terrenos, clima, dia/noite, moral, suprimentos e generais entram no cálculo de batalha.</li><li>Capital perdida gera crise de 2 turnos e penalidades declaradas.</li><li>Save usa versão do motor para evitar carregar estado incompatível.</li></ul></div><div class="card"><h3>Condições de vitória</h3>${victoryDefs.map(v=>`<div class="choice" style="margin-bottom:7px"><b>${v[0]}</b><div class="tag">${v[1]}</div></div>`).join('')}<div class="dangerBox"><b>Capital:</b> perda gera crise, -20 moral, -25% produção, -2 prestígio. Se não for recuperada no prazo do motor, a condição de derrota é aplicada quando o evento de capital for resolvido.</div></div></div><div class="card" style="margin-top:12px"><h3>Custos de evolução de construções</h3><p>I→II: 100 ouro + 50 madeira.</p><p>II→III: 200 ouro + 100 madeira.</p><p>III→IV: 350 ouro + 150 madeira + 50 ferro.</p><p>IV→V: 600 ouro + 250 madeira + 100 ferro.</p><p class="muted">Multiplicadores de efeito: I 100%, II 150%, III 200%, IV 300%, V 450%.</p></div>`}
function selectTerritory(id){state.selectedTerritory=id;save();render()}function selectArmy(id){state.selectedArmy=id;save();render()}
function bindGame(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();render()});document.getElementById('saveBtn').onclick=()=>{save();toast('Partida salva.','good')};document.getElementById('newGameBtn').onclick=()=>{if(confirm('Criar uma nova partida e substituir a atual?')){state=null;render()}};document.addEventListener('keydown',keyHandler,{once:true});document.querySelectorAll('.filterCat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filterCat').forEach(x=>x.classList.remove('active'));b.classList.add('active');const c=b.dataset.cat;document.querySelectorAll('#recruitTable tbody tr').forEach(r=>r.style.display=(c==='Todos'||r.dataset.cat===c)?'':'none')});}
function keyHandler(e){if(e.key.toLowerCase()==='s'){save();toast('Save atualizado.','good')}if(e.key.toLowerCase()==='n'){endTurn()}}
window.selectTerritory=selectTerritory;window.selectArmy=selectArmy;window.createGarrison=createGarrison;window.sendSupplies=sendSupplies;window.transferResources=transferResources;window.transferTroops=transferTroops;window.createTradeRoute=createTradeRoute;window.scorchedEarth=scorchedEarth;window.factionAbility=factionAbility;window.arcanePortal=arcanePortal;window.developTerritory=developTerritory;window.startBuild=startBuild;window.upgradeBuild=upgradeBuild;window.recruit=recruit;window.recruitLegendary=recruitLegendary;window.deployGeneral=deployGeneral;window.armyById=armyById;window.fortify=fortify;window.moveArmy=moveArmy;window.endTurn=endTurn;window.battle=battle;window.relationAction=relationAction;window.spy=spy;window.sabotage=sabotage;window.useMagic=useMagic;window.adminAction=adminAction;window.claimTitle=claimTitle;window.assignGen=assignGen;window.setStrategy=setStrategy;
onlineInit();
if(!online){if(load()){}render();}

(function installBuildDelegation(){document.addEventListener('click',function(e){const b=e.target.closest&&e.target.closest('.buildAction');if(!b||b.disabled)return;const tid=b.dataset.tid,bid=b.dataset.bid;if(b.dataset.buildAction==='build')build(tid,bid);else if(b.dataset.buildAction==='upgrade')upgrade(tid,bid);});})();
</script>
